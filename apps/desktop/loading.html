<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline';" />
    <title>Viral Cut Manager</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
        color: #e7ebf2;
        font-family: -apple-system, system-ui, sans-serif;
        -webkit-user-select: none;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        -webkit-app-region: drag;
      }
      .logo { font-size: 1.4rem; font-weight: 700; }
      .sub { font-size: .8rem; color: #8b94a7; }
      .spinner {
        width: 34px; height: 34px;
        border: 3px solid #262d3d;
        border-top-color: #5b8cff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #status {
        font-size: .85rem;
        color: #8b94a7;
        min-height: 1.2em;
        text-align: center;
        max-width: 80%;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">Viral Cut Manager</div>
      <div class="sub">data &amp; revenus</div>
      <div class="spinner"></div>
      <div id="status">Démarrage…</div>
    </div>
    <script>
      window.__setStatus = function (msg) {
        var el = document.getElementById("status");
        if (el) el.textContent = msg;
      };
    </script>
  </body>
</html>
